<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="ET Trials Tracker" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>ET Trials Tracker</title>
  <rect width="1200" height="630" fill="#fcfcfb"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <text x="40" y="265" fill="#1a1a19" font-size="92" font-weight="700">ET Trials Tracker</text>
    <line x1="40" y1="315" x2="1160" y2="315" stroke="#b9b6ab" stroke-width="2"/>
    <text x="40" y="385" fill="#1a1a19" font-size="34">Results reporting for interventional clinical trials in essential tremor.</text>
    <text x="40" y="440" fill="#35342f" font-size="30">Which completed trials never posted results, and what a literature search found</text>
